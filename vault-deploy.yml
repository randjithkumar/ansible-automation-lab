---
- name: Practise deploying an encrypted variable
  hosts: managed
  gather_facts: false

  vars_files:
    - vault/demo.yml

  tasks:
    - name: Write a protected file containing the dummy token
      become: true
      ansible.builtin.copy:
        dest: /opt/ansible-demo/vault-practice.conf
        content: |
          DEMO_API_TOKEN={{ demo_api_token }}
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Confirm the protected file was deployed
      ansible.builtin.debug:
        msg: "Vault practice file deployed successfully."
